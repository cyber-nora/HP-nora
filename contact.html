<!doctype html>
<html lang="ja">
<head>

  <title>Contact — nora</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .contact-form-embed {
      width: 100%;
      margin-top: 40px;

    .contact-form-embed iframe {
      display: block;
      width: 100%;
      max-width: 720px;
      height: 850px;
      border: 0;
      margin: 0 auto;
    }

    @media (max-width: 600px) {
      .contact-form-embed {
        margin-top: 28px;
      }

      .contact-form-embed iframe {

      }

  </style>

<body>
  <header class="site-header inner-header">
    <a class="brand" href="index.html" aria-label="NORA home">
      <img src="images/nora-logo.png" alt="nora">

    <nav aria-label="Main navigation">
      <a href="about.html">About</a>
      <a href="https://note.com/nora_works"

  </header>

  <main class="contact-page">
    <div class="page-kicker">CONTACT</div>

    <div class="contact-layout">
      <div>
        <h1>お問い合わせ</h1>

      </div>

    <div class="contact-form-embed">
  <iframe
    src="https://tally.so/embed/rjNYdR?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
