<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="nora — 音は、時代を旅する。">
  <title>nora — 音は、時代を旅する。</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="NORA home">
      <img src="images/nora-logo.png" alt="nora">
    </a>
    <nav aria-label="Main navigation">
      <a href="about.html">About</a>
      <a href="news.html">News</a>
      <a href="https://note.com/nora_works" target="_blank" rel="noopener">Works</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="home">
    <section class="hero-copy">
      <h1>音は、<br>時代を旅する。</h1>
      <span class="hairline" aria-hidden="true"></span>
      <p class="intro">日常は、<br>360°音に包まれている。<br><br>人は、音と暮らしている。<br><br>機織りの響き、<br>田んぼの風、<br>工場のリズム。<br><br>それは今日の音であり、<br>百年前の音でもある。<br><br>時代が変わり、<br>街のサウンドスケープ（音風景）が変わっても、<br>今も昔も、変わらない音がある。<br><br>その音は、<br>時代を旅する。</p>
      </section>
<section class="news-preview" aria-labelledby="news-title">
        <div class="news-heading">
          <span id="news-title">NEWS</span>
          <a href="news.html">ALL NEWS →</a>
        </div>
        <div id="news-list" class="news-list" aria-live="polite"></div>
      </section>
    </section>

    <figure class="hero-exhibit">
      <div class="art-frame">
        <img src="images/home-exhibit1.jpg" alt="NORA field recording artwork">
      </div>

    </figure>

    <section class="works-block" aria-labelledby="works-title">
      <a class="works-link" id="works-title" href="https://note.com/nora_works" target="_blank" rel="noopener">
        <span class="works-label">Works</span>
        <span class="works-rule" aria-hidden="true"></span>
        <span class="arrow">→</span>
      </a>
      <a class="note-link" href="https://note.com/nora_works" target="_blank" rel="noopener">
        <span class="note-mark">n</span>
        <span><strong>nora works</strong><small>SOUND / IDEA / SOMETHING</small></span>
        <span class="arrow">→</span>
      </a>
    </section>
  </main>

    <div class="scroll-mark" aria-hidden="true"><span>SCROLL</span><i></i></div>

  <script>
    fetch("data/news.json")
      .then(response => {
        if (!response.ok) throw new Error("NEWS data could not be loaded.");
        return response.json();
      })
      .then(items => {
        const list = document.getElementById("news-list");
        items.slice(0, 3).forEach(item => {
          const link = document.createElement("a");
          link.className = "news-item";
          link.href = item.url;
          link.target = "_blank";
          link.rel = "noopener";
          link.innerHTML = `
            <time datetime="${item.date.replaceAll('.', '-')}">${item.date}</time>
            <span class="news-title">${item.title}</span>
            <span class="news-arrow">→</span>
          `;
          list.appendChild(link);
        });
      })
      .catch(error => console.error(error));
  </script>

</body>
</html>
