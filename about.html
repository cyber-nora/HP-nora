      <article class="about-copy">
        <p>noraは、音をキーワードに、<br>Web作品をはじめ、さまざまな表現で<br>作品や体験をつくるクリエイティブチームです。</p>

        <p>フィールドレコーディングを通して<br>日常にある音を記録し、<br>その音が持つ記憶や時間、風景に耳を傾ける。</p>

        <p>そして、音を「聴く」だけではなく、<br>新たな体験へと変えていく。</p>

        <p>noraは、音を、もう一度おもしろくする。</p>
